<script>
const outputText=document.getElementById('outputText'),outputImage=document.getElementById('outputImage'),qr=document.getElementById('qr'),outputFile=document.getElementById('outputFile');
function clearOutput(){outputText.innerHTML='';outputImage.removeAttribute('src');outputImage.style.display='none';qr.innerHTML='';qr.style.display='none'}
function addOutputText(){const value=prompt('اكتبي نص المخرج النهائي:');if(!value)return;clearOutput();outputText.textContent=value}
function addOutputLink(){const value=prompt('الصقي الرابط:');if(!value)return;const url=value.trim();if(!/^https?:\/\//i.test(url)){alert('يجب أن يبدأ الرابط بـ http:// أو https://');return}clearOutput();const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=url;outputText.appendChild(link);qr.style.display='block';const qrImage=document.createElement('img');qrImage.alt='QR Code';qrImage.src='https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent(url);qr.appendChild(qrImage)}
outputFile.addEventListener('change',function(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(event){clearOutput();outputImage.src=event.target.result;outputImage.style.display='block'};reader.readAsDataURL(file)});
document.querySelectorAll('.photo').forEach(function(box){const input=box.querySelector('input'),button=box.querySelector('button');button.addEventListener('click',function(){input.click()});input.addEventListener('change',function(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(event){let image=box.querySelector('img');if(!image){image=document.createElement('img');image.alt='صورة شاهد';box.appendChild(image)}image.onload=function(){image.style.display='block';image.style.visibility='visible';image.style.opacity='1'};image.src=event.target.result;box.classList.add('has-image');button.textContent='تغيير الصورة'};reader.readAsDataURL(file)})});
</script>
